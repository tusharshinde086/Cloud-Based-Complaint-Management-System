<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Complaint Management{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/css/app.css" rel="stylesheet"></head><body class="bg-light">
<nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="{% url 'dashboard' %}">Complaint Management</a>
<div class="d-flex gap-2">{% if request.user.is_authenticated %}<span class="navbar-text text-white">{{ request.user.username }}</span>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Logout</button></form>
{% else %}<a class="btn btn-sm btn-outline-light" href="{% url 'login' %}">Login</a><a class="btn btn-sm btn-light" href="{% url 'register' %}">Register</a>{% endif %}</div></div></nav>
<main class="container py-4">{% if messages %}{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
