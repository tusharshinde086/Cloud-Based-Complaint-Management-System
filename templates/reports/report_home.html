{% extends "base.html" %}
{% block title %}Complaint Reports{% endblock %}
{% block content %}
<div class="container py-4">
  <h1 class="h3 mb-2">Complaint Reports</h1>
  <p class="text-muted">Download a PDF report containing only complaints visible to your account role.</p>
  <div class="card"><div class="card-body">
    <form method="get" action="{% url 'complaint_report_pdf' %}" class="row g-3">
      <div class="col-md-3">
        <label class="form-label" for="status">Status</label>
        <select class="form-select" id="status" name="status">
          <option value="">All statuses</option>
          {% for value,label in statuses %}
            <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="category">Category</label>
        <input class="form-control" id="category" name="category" placeholder="Exact category">
      </div>
      <div class="col-md-3">
        <label class="form-label" for="start_date">Created from</label>
        <input class="form-control" type="date" id="start_date" name="start_date">
      </div>
      <div class="col-md-3">
        <label class="form-label" for="end_date">Created to</label>
        <input class="form-control" type="date" id="end_date" name="end_date">
      </div>
      <div class="col-12">
        <button class="btn btn-primary" type="submit">Download PDF report</button>
        <a class="btn btn-outline-secondary" href="{% url 'complaint_list' %}">Back to complaints</a>
      </div>
    </form>
  </div></div>
</div>
{% endblock %}
